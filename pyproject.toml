[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blueda"
version = "0.5.1"
description = "전처리 판단부터 분석 로그까지 남기는 EDA 도우미"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "scipy>=1.9",
    "openpyxl>=3.1",
    "matplotlib>=3.6",
    "statsmodels>=0.14",
    "seaborn>=0.13",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["pytest>=7", "pytest-qt>=4", "ipykernel"]

[project.gui-scripts]
blueda = "blueda.gui.app:main"

[tool.setuptools]
packages = ["blueda", "blueda.gui", "blueda.gui.widgets"]

[tool.setuptools.package-data]
"blueda.gui" = ["assets/*.svg"]
