[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blueda"
version = "0.1.0"
description = "전처리 판단부터 분석 로그까지 남기는 EDA 도우미"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.6", "seaborn>=0.12"]
dev = ["pytest>=7", "ipykernel"]

[tool.setuptools]
packages = ["blueda"]
